name: WebSolutions CI

on:
  push:
    branches: [main]
    paths:
      - "tp/02-infrastructure-as-code-websolutions/**"
      - ".github/workflows/websolutions.yml"
  pull_request:
    branches: [main]
    paths:
      - "tp/02-infrastructure-as-code-websolutions/**"
      - ".github/workflows/websolutions.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp/02-infrastructure-as-code-websolutions/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tp/02-infrastructure-as-code-websolutions/app/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-test:
    name: Deploy to ephemeral test environment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.sha }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: tp/02-infrastructure-as-code-websolutions
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
      - run: tofu init -input=false
      - run: tofu fmt -check
      - run: tofu validate
      - run: tofu apply -input=false -auto-approve
      - run: cp .env.example .env
      - run: pipx install ansible-core==2.17.14
      - run: ansible-playbook -i ansible/inventory.ini ansible/configure.yml --diff
      - run: ansible-playbook -i ansible/inventory.ini ansible/configure.yml --diff
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: curl --retry 10 --retry-connrefused --retry-delay 2 -fsS http://127.0.0.1:8080/health
      - run: curl -fsS http://127.0.0.1:8080/
      - name: Stop test services
        if: always()
        run: docker compose down --volumes --remove-orphans || true
      - name: Destroy test infrastructure
        if: always()
        run: tofu destroy -input=false -auto-approve || true