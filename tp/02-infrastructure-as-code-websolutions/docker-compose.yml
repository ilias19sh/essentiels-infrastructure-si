services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-websolutions}
      POSTGRES_USER: ${POSTGRES_USER:-websolutions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 2s
      retries: 20

  app:
    image: websolutions-api:${APP_VERSION:-local}
    build:
      context: ./app
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-websolutions}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-websolutions}
    networks:
      - test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - test
    depends_on:
      app:
        condition: service_healthy

networks:
  test:
    external: true
    name: websolutions-test

volumes:
  postgres-data:
    external: true
    name: websolutions-test-postgres