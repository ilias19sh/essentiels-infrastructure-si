---
- name: Configure Nginx for WebSolutions test
  hosts: test
  gather_facts: false
  tasks:
    - name: Ensure the Nginx configuration directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../nginx"
        state: directory
        mode: "0755"

    - name: Render the reverse proxy configuration
      ansible.builtin.template:
        src: templates/default.conf.j2
        dest: "{{ playbook_dir }}/../nginx/default.conf"
        mode: "0644"